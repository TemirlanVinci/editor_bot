[package]
name = "editor_video_back"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }

axum = "0.8.9"

dotenvy = "0.15"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "macros",
    "chrono",
] }

chrono = { version = "0.4", features = ["serde"] }

tower-http = { version = "0.7.0", features = ["cors", "trace"] }

tracing = "0.1"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
axum-test = "21.1.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
serde_json = "1.0"
tokio = { version = "1.38", features = [
    "macros",
    "rt-multi-thread",
    "test-util",
] }
