services:
  postgres:
    image: postgres:16-alpine
    container_name: editor_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-db_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-editor_video_db}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-db_admin} -d ${POSTGRES_DB:-editor_video_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./editor_video_back
      dockerfile: Dockerfile
      args:
        # small (~466MB, дефолт) / base (~142MB, быстрее) / medium (~1.5GB, точнее)
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    container_name: editor_backend
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-db_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-editor_video_db}
      PORT: 8081
      BOT_SECRET: ${BOT_SECRET}
      MEDIA_DIR: /app/media
      WHISPER_MODEL_PATH: /app/models/ggml-${WHISPER_MODEL:-small}.bin
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
      LLM_API_URL: ${LLM_API_URL:-http://llm:11434}
      QWEN_MODEL_NAME: ${QWEN_MODEL_NAME:-qwen2.5:3b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECS: ${LLM_TIMEOUT_SECS:-120}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_started
    volumes:
      - ./media:/app/media
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  llm:
    image: ollama/ollama:latest
    container_name: editor_llm
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        limits:
          memory: 12G
        # Для активации GPU NVIDIA раскомментируйте блок ниже (требуется nvidia-container-toolkit на хосте):
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  llm-init:
    image: ollama/ollama:latest
    container_name: editor_llm_init
    restart: "no"
    environment:
      OLLAMA_HOST: http://llm:11434
      QWEN_MODEL_NAME: ${QWEN_MODEL_NAME:-qwen2.5:3b}
    depends_on:
      - llm
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "⏳ Waiting for Ollama service to start..."
        while ! ollama list > /dev/null 2>&1; do
          sleep 2
        done
        echo "📦 Ensuring model '$${QWEN_MODEL_NAME}' is downloaded..."
        ollama pull $${QWEN_MODEL_NAME}
        echo "✅ Model '$${QWEN_MODEL_NAME}' is ready!"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"


  bot:
    build:
      context: ./editor_video_bot
      dockerfile: Dockerfile
    container_name: editor_bot
    restart: always
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_URL: http://backend:8081
      BOT_SECRET: ${BOT_SECRET}
      MEDIA_DIR: /app/media
      TELEGRAM_LOCAL_SERVER: ${TELEGRAM_LOCAL_SERVER:-}
      ADMIN_IDS: ${ADMIN_IDS:-}


    depends_on:
      - backend
    volumes:
      - ./media:/app/media
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  ollama_data: